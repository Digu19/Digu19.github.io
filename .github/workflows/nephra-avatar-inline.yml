name: One-time Nephra avatar inline

on:
  push:
    paths:
      - '.github/workflows/nephra-avatar-inline.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline Nephra avatar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          data='data:image/jpeg;base64,'
          s=s.replace('src="assets/nephra-avatar.jpg"',f'src="{data}"',1)
          p.write_text(s)
          PY
      - name: Commit avatar fix
        run: |
          rm -f .github/workflows/nephra-avatar-inline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/nephra-avatar-inline.yml
          git commit -m "Embed Nephra avatar in contact section"
          git push
