name: Fix meta description once
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update meta description
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'Dr. Kumar Digvijay is a translational nephrology and biomarker researcher working across kidney transplantation, extracellular vesicles, CKD, AKI, scientific writing and research support.'
          new = 'Dr. Kumar Digvijay is a translational nephrology and biomarker researcher focused on kidney transplantation, extracellular vesicles, CKD and AKI.'
          if old not in s:
              raise SystemExit('Current meta description not found; no change made.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "Digu19"
          git config user.email "librandigu@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Shorten meta description for SEO"
          git push
