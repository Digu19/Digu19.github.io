name: One-time visual website update

on:
  push:
    paths:
      - '.github/workflows/site-visual-update.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage visuals and profile text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          s = s.replace('PhD · Translational Nephrology & Biomarker Research Scientist','Translational Nephrology & Biomarker Research Scientist',1)
          s = s.replace('<a href="#research">Research</a><a href="#experience">Experience</a>', '<a href="#research">Research</a><a href="#methods">Methods</a><a href="#experience">Experience</a>', 1)

          methods = '''<section id="methods"><div class="wrap"><div class="section-head"><div><div class="kicker">Technical profile</div><h2>Methods & capabilities</h2></div><p>Hands-on and study-development experience across translational nephrology, biomarker research and clinically oriented laboratory workflows.</p></div><div class="grid"><div class="card"><h3>Extracellular vesicles</h3><p>Urinary and plasma EV isolation, pre-analytical handling and translational phenotyping workflows.</p><span class="tag">EV workflows</span></div><div class="card"><h3>Flow cytometry & MACSPlex</h3><p>Multiplex bead-based EV phenotyping, flow-cytometric acquisition and interpretation in biomarker studies.</p><span class="tag">Flow cytometry</span></div><div class="card"><h3>Biomarker studies</h3><p>Clinical biomarker framing, multimarker strategies, sample-linked phenotyping and interpretation.</p><span class="tag">Translational biomarkers</span></div><div class="card"><h3>Clinical cohorts</h3><p>Prospective human studies, biospecimen-linked data collection, multicentre coordination and quality review.</p><span class="tag">Clinical research</span></div><div class="card"><h3>Protocols & CRFs</h3><p>Study protocols, case-report forms, research documentation and operational study planning.</p><span class="tag">Study design</span></div><div class="card"><h3>Scientific synthesis</h3><p>Evidence synthesis, manuscript development, translational project framing and publication-oriented reporting.</p><span class="tag">Scientific writing</span></div></div></div></section>'''
          if 'id="methods"' not in s:
              s = s.replace('<section id="experience">', methods + '\n<section id="experience">', 1)

          old_note = '<div class="service-note"><strong>Nephra · AI Research Assistant</strong><br>Nephra can answer questions about my public research profile, publications, doctoral work and scientific services. It does not accept projects, negotiate terms or make commitments on my behalf. Use the Nephra chat widget on this page for quick questions; use the private form for formal or confidential enquiries.</div>'
          new_note = '<div class="service-note" style="display:flex;gap:14px;align-items:center"><img src="assets/nephra-avatar.jpg" alt="Nephra AI Research Assistant" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #cfe1e5;flex:0 0 auto"><div><strong>Nephra · AI Research Assistant</strong><br>Nephra can answer questions about my public research profile, publications, doctoral work and scientific services. It does not accept projects, negotiate terms or make commitments on my behalf. Use the Nephra chat widget on this page for quick questions; use the private form for formal or confidential enquiries.</div></div>'
          s = s.replace(old_note,new_note,1)

          p.write_text(s)
          PY
      - name: Commit website update
        run: |
          rm -f .github/workflows/site-visual-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/site-visual-update.yml
          git commit -m "Refine hero, add methods section and Nephra identity"
          git push
