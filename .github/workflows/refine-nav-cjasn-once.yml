name: Refine navigation and CJASN once
on: [push]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update navigation and CJASN authors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_nav = '<div class="navlinks"><a href="#about">About</a><a href="#research">Research</a><a href="#methods">Methods</a><a href="#experience">Experience</a><a href="#thesis">Thesis</a><a href="#publications">Publications</a><a href="#current-work">Current work</a><a href="#services">Research Support</a><a href="#service">Editorial</a><a href="#contact">Consultation</a><a href="#feedback">Feedback</a></div>'
          new_nav = '<div class="navlinks"><a href="#about">About</a><a href="#research">Research</a><a href="#experience">Experience</a><a href="#publications">Publications</a><a href="#current-work">Current Work</a><a href="#services">Research Support</a><a href="#contact">Contact</a></div>'
          old_authors = '<div class="authors">Kumar Digvijay · Claudio Ronco · John A. Kellum</div>'
          new_authors = '<div class="authors">Kumar Digvijay · Shalini Priya Chandrasekaran · Lucas Gobetti da Luz · Tapas Kumar Sahoo · John A. Kellum · Claudio Ronco</div>'
          if old_nav not in s:
              raise SystemExit('Navigation string not found; no change made.')
          if old_authors not in s:
              raise SystemExit('CJASN author string not found; no change made.')
          s = s.replace(old_nav, new_nav, 1).replace(old_authors, new_authors, 1)
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "Digu19"
          git config user.email "librandigu@gmail.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine navigation and correct CJASN authors"
          git push
