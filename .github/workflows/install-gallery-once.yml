name: Publish three-photo gallery once
on:
  push:
    paths:
      - '.github/workflows/install-gallery-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified original photographs and gallery page
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          items = {
              'award': ('ac54cf0a8563b1e8a4efe578eec34147fb66d3be6928c3d6d253ff6d520fc3f1', 6),
              'biomarker': ('c7b944806dd371e84ae0c4dcb86cbf23885dd58053eb493d8bdc455d0274f378', 5),
              'presentation': ('de169c76bf4d3c142e94c9ffcc1808df285f7ac9f0c286af0a150088299ae5e2', 3),
          }
          for key, (sha, num) in items.items():
              parts = [Path(f'assets/.gallery-{key}.part{i:02d}.txt') for i in range(1,num+1)]
              for p in parts:
                  if not p.exists(): raise RuntimeError(f'Missing {p}')
              raw = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=False)
              if hashlib.sha256(raw).hexdigest()!=sha:
                  raise RuntimeError(f'Invalid digest for {key}; not publishing')
              if not raw.startswith(b'\xff\xd8\xff') or not raw.endswith(b'\xff\xd9'):
                  raise RuntimeError(f'Invalid JPEG image {key}')
              Path(f'assets/gallery-{key}.jpg').write_bytes(raw)
              for p in parts: p.unlink()
          p=Path('gallery.html')
          s=p.read_text(encoding='utf-8')
          anchor='<div class="photo-grid" id="gallery-photos"></div>'
          if anchor not in s: raise RuntimeError('Gallery anchor not found; not publishing')
          gallery='''<div class="photo-grid" id="gallery-photos">
          <figure><a href="assets/gallery-biomarker.jpg" target="_blank" rel="noopener" title="Open full-size photograph"><img src="assets/gallery-biomarker.jpg" alt="Dr. Kumar Digvijay presenting proposed kidney transplant biomarker research on dd-cfDNA, DSA and extracellular vesicles" loading="lazy"></a><figcaption><strong>Kidney transplant biomarker research</strong><small>Presentation of a proposed multimarker approach integrating dd-cfDNA, donor-specific antibodies and extracellular vesicles.</small></figcaption></figure>
          <figure><a href="assets/gallery-award.jpg" target="_blank" rel="noopener" title="Open full-size photograph"><img src="assets/gallery-award.jpg" alt="Dr. Kumar Digvijay at an academic recognition event holding a certificate" loading="lazy"></a><figcaption><strong>Academic recognition</strong><small>A documented moment from an academic recognition event.</small></figcaption></figure>
          <figure><a href="assets/gallery-presentation.jpg" target="_blank" rel="noopener" title="Open full-size photograph"><img src="assets/gallery-presentation.jpg" alt="Dr. Kumar Digvijay presenting renal functional reserve research at an academic lecture hall" loading="lazy"></a><figcaption><strong>Doctoral research presentation</strong><small>Presentation of renal functional reserve research undertaken during doctoral studies at the University of Turin.</small></figcaption></figure>
          </div>'''
          s=s.replace(anchor,gallery,1)
          s=s.replace('.photo-grid img{width:100%;aspect-ratio:4/3;display:block;object-fit:cover}', '.photo-grid img{width:100%;height:290px;display:block;object-fit:contain;background:#eef3f4}.photo-grid figure a{display:block;cursor:zoom-in}.photo-grid figure a:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}',1)
          p.write_text(s,encoding='utf-8')
          print('All three JPEGs verified and gallery updated')
          PY
      - name: Publish and clean temporary staged image files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gallery.html assets/gallery-award.jpg assets/gallery-biomarker.jpg assets/gallery-presentation.jpg
          git add -u assets/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish three verified photos on dedicated Gallery page'
          git push
