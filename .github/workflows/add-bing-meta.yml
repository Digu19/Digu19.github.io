name: Add Bing verification meta tag
on:
  push:
    paths:
      - '.github/workflows/add-bing-meta.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Insert Bing verification meta tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<meta name="msvalidate.01" content="3BD8FF8B861DD084C56B94269748643A" />'
          if tag not in s:
              needle='<meta name="google-site-verification" content="xRHo_mvU4MoRKNP28szA_iZ0GLJD18J5v5umpca0Pa8" />'
              s=s.replace(needle, needle+'\n'+tag)
              p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "Digu19"
          git config user.email "librandigu@gmail.com"
          git add index.html
          git commit -m "Add Bing Webmaster verification meta tag" || exit 0
          git push
