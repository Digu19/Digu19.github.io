name: One-time site text refresh
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/site-text-refresh-once.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update experience wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="kicker">Trajectory</div><h2>Selected experience</h2>'
          new='<div class="kicker">Trajectory</div><h2>Research Experience</h2>'
          if old not in s:
              raise SystemExit('Selected experience heading not found')
          s=s.replace(old,new,1)
          old2='<h3>Research Fellow · International Renal Research Institute of Vicenza, Italy</h3><p>AKI biomarkers, CRRT and sepsis-associated kidney injury; collaboration continued through joint publications.</p>'
          new2='<h3>Research Fellow · International Renal Research Institute of Vicenza (IRRIV), Italy</h3><p>Research fellowship in 2018; ongoing research collaboration, 2018–present, including joint work in AKI biomarkers, CRRT, sepsis-associated kidney injury and scientific publications.</p>'
          if old2 not in s:
              raise SystemExit('IRRIV role block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Clarify research experience and ongoing IRRIV collaboration'
          git push
