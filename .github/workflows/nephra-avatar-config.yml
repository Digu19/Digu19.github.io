name: One-time Nephra avatar configuration
on:
  push:
    paths:
      - '.github/workflows/nephra-avatar-config.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Nephra avatar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          target='<script src="https://files.bpcontent.cloud/2026/11/03/10/20261103103741-DBYPEP89.js" defer></script>'
          extra='''<script>\nwindow.addEventListener('load',function(){\n  if(window.botpress&&window.botpress.on){\n    window.botpress.on('webchat:initialized',function(){\n      window.botpress.config({configuration:{\n        botName:'Nephra',\n        botAvatar:'https://digu19.github.io/assets/nephra-avatar.jpg',\n        botDescription:'AI Research Assistant for Dr. Kumar Digvijay'\n      }});\n    });\n  }\n});\n</script>'''
          if 'assets/nephra-avatar.jpg' not in s.split(target)[-1]:
              s=s.replace(target,target+'\n'+extra)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          rm .github/workflows/nephra-avatar-config.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/nephra-avatar-config.yml
          git commit -m "Configure Nephra chat avatar" || exit 0
          git push