name: Insert pathway graphic markup reliably
on:
  push:
    paths:
      - '.github/workflows/fix-pathway-markup.yml'
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert visible pathway and confirm feedback nav
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          if '<a href="#feedback">Feedback</a>' not in s:
              s=s.replace('<a href="#contact">Consultation</a>', '<a href="#contact">Consultation</a><a href="#feedback">Feedback</a>', 1)

          if 'id="translation-map"' not in s:
              marker='<section id="about">'
              graphic='''<section id="translation-map" class="translation-map"><div class="wrap"><div class="translation-copy"><div class="kicker">Translational pathway</div><h2>From kidney biology to clinically useful signals</h2><p>A visual summary of the research continuum connecting kidney transplantation, extracellular-vesicle phenotyping, biomarker interpretation and regenerative nephrology.</p></div><div class="pathway" aria-label="Translational nephrology research pathway"><div class="path-node"><div class="path-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M19 7c-7 0-12 6-12 14 0 10 7 17 15 17 4 0 6-3 6-7V13c0-4-4-6-9-6Z"/><path d="M29 10c7 0 12 6 12 14 0 8-5 14-12 16"/></svg></div><strong>Kidney transplantation</strong><span>Allograft injury & phenotyping</span></div><div class="path-arrow">→</div><div class="path-node"><div class="path-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="17" cy="18" r="7"/><circle cx="31" cy="16" r="5"/><circle cx="29" cy="31" r="8"/><circle cx="14" cy="33" r="4"/></svg></div><strong>Extracellular vesicles</strong><span>Urine & plasma EV signals</span></div><div class="path-arrow">→</div><div class="path-node"><div class="path-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 37V11M9 37h31"/><path d="m14 31 8-9 7 5 10-14"/><circle cx="14" cy="31" r="2"/><circle cx="22" cy="22" r="2"/><circle cx="29" cy="27" r="2"/><circle cx="39" cy="13" r="2"/></svg></div><strong>Biomarker integration</strong><span>Multimarker interpretation</span></div><div class="path-arrow">→</div><div class="path-node"><div class="path-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="6"/><circle cx="13" cy="18" r="4"/><circle cx="35" cy="17" r="4"/><circle cx="15" cy="33" r="4"/><circle cx="34" cy="34" r="4"/><path d="M17 20l4 2M30 21l2-1M19 30l3-3M29 29l3 3"/></svg></div><strong>Regenerative nephrology</strong><span>Repair biology & translation</span></div></div></div></section>\n'''
              if marker not in s:
                  raise SystemExit('Research profile marker not found')
              s=s.replace(marker, graphic+marker, 1)

          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Insert visible translational pathway graphic" || exit 0
          git push
