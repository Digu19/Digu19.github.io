name: Final content and SEO update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-content-seo.yml']
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final content and visual updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Add a clearly visible translational research pathway graphic.
          if 'id="translation-map"' not in s:
              marker='</section>\n<section id="about">'
              visual='''</section>\n<section id="translation-map" class="translation-map"><div class="wrap"><div class="translation-copy"><div class="kicker">Translational pathway</div><h2>From kidney biology to clinically useful signals</h2><p>A visual summary of the research continuum linking kidney transplantation, extracellular-vesicle phenotyping, biomarker interpretation and regenerative nephrology.</p></div><div class="pathway" aria-label="Translational nephrology research pathway"><div class="path-node"><div class="path-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M19 7c-7 0-12 6-12 14 0 10 7 17 15 17 4 0 6-3 6-7V13c0-4-4-6-9-6Z"/><path d="M29 10c7 0 12 6 12 14 0 8-5 14-12 16"/></svg></div><strong>Kidney transplantation</strong><span>Allograft injury & phenotyping</span></div><div class="path-arrow">→</div><div class="path-node"><div class="path-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="17" cy="18" r="7"/><circle cx="31" cy="16" r="5"/><circle cx="29" cy="31" r="8"/><circle cx="14" cy="33" r="4"/></svg></div><strong>Extracellular vesicles</strong><span>Urine & plasma EV signals</span></div><div class="path-arrow">→</div><div class="path-node"><div class="path-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 37V11M9 37h31"/><path d="m14 31 8-9 7 5 10-14"/><circle cx="14" cy="31" r="2"/><circle cx="22" cy="22" r="2"/><circle cx="29" cy="27" r="2"/><circle cx="39" cy="13" r="2"/></svg></div><strong>Biomarker integration</strong><span>Multimarker interpretation</span></div><div class="path-arrow">→</div><div class="path-node"><div class="path-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="6"/><circle cx="13" cy="18" r="4"/><circle cx="35" cy="17" r="4"/><circle cx="15" cy="33" r="4"/><circle cx="34" cy="34" r="4"/><path d="M17 20l4 2M30 21l2-1M19 30l3-3M29 29l3 3"/></svg></div><strong>Regenerative nephrology</strong><span>Repair biology & translation</span></div></div></div>'''
              s=s.replace(marker,visual+'\n<section id="about">',1)

          # Add CSS for the visible pathway graphic.
          if '.translation-map{' not in s:
              css='''\n.translation-map{padding:56px 0;background:linear-gradient(135deg,#103544 0%,#155564 60%,#19717d 120%);color:#fff;border-top:0}.translation-map .wrap{display:grid;grid-template-columns:.8fr 1.7fr;gap:42px;align-items:center}.translation-map .kicker{color:#a7dde2}.translation-map h2{font-family:'Source Serif 4',serif;font-size:2.15rem;line-height:1.08;margin:0 0 12px}.translation-map p{margin:0;color:rgba(255,255,255,.78);max-width:480px}.pathway{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:10px;align-items:center}.path-node{text-align:center;padding:18px 10px}.path-icon{width:70px;height:70px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);box-shadow:0 12px 26px rgba(0,0,0,.12)}.path-icon svg{width:40px;height:40px;fill:none;stroke:#d7f2f4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.path-node strong{display:block;font-size:.88rem;line-height:1.25}.path-node span{display:block;margin-top:4px;font-size:.72rem;color:rgba(255,255,255,.67);line-height:1.3}.path-arrow{font-size:1.6rem;color:#9ed9df;font-weight:700}@media(max-width:940px){.translation-map .wrap{grid-template-columns:1fr}.pathway{grid-template-columns:1fr 1fr;gap:14px}.path-arrow{display:none}}@media(max-width:620px){.pathway{grid-template-columns:1fr}.translation-map{padding:46px 0}}\n'''
              s=s.replace('#contact{',css+'#contact{',1)

          # Add project/grant-development support as a paid research-support service.
          if 'Project & grant-development support' not in s:
              target='<div class="service"><div class="service-icon">TN</div><h3>Translational nephrology & biomarker consulting</h3><p>Kidney transplantation, extracellular vesicles, CKD/AKI biomarkers, translational project framing and scientific strategy.</p></div></div><div class="service-note">'
              replacement='<div class="service"><div class="service-icon">TN</div><h3>Translational nephrology & biomarker consulting</h3><p>Kidney transplantation, extracellular vesicles, CKD/AKI biomarkers, translational project framing and scientific strategy.</p></div><div class="service"><div class="service-icon">GD</div><h3>Project & grant-development support</h3><p>Concept notes, literature-backed scientific rationale, proposal framing, protocol and work-package input, consortium-facing scientific drafting and support for collaborative biomedical proposals, including Horizon Europe-style projects.</p></div></div><div class="service-note">'
              s=s.replace(target,replacement,1)
              s=s.replace('publication-oriented writing, evidence synthesis, study documentation or translational project development.','publication-oriented writing, evidence synthesis, study documentation, translational project development or collaborative grant/proposal preparation.',1)

          # Strengthen searchable expertise terms in structured data.
          if 'Grant writing' not in s:
              s=s.replace('"Scientific writing"]','"Scientific writing","Research project development","Grant writing","Horizon Europe proposal development"]',1)

          # Add WebSite schema for search engines.
          if '"@type":"WebSite"' not in s:
              website_schema='''\n<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Dr. Kumar Digvijay | Translational Nephrology & Biomarker Research","url":"https://digu19.github.io/","description":"Academic and professional website of Dr. Kumar Digvijay covering translational nephrology, kidney transplantation, extracellular vesicles, biomarkers, regenerative nephrology, scientific writing and research support.","inLanguage":"en"}</script>\n'''
              s=s.replace('</head>',website_schema+'</head>',1)

          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add research pathway graphic and grant development service" || exit 0
          git push
